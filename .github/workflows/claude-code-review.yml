name: Claude Code Review

# 리뷰 기준: CLAUDE.md -> AGENTS.md의 ## Code Review Rules (docs/conventions/code-review.md)
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    # 자동: draft가 아닌 PR을 열 때 한 번. 수동: PR 댓글 맨 앞에 `@claude review`.
    # 댓글 요청자의 쓰기 권한은 claude-code-action이 확인합니다.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-plugins-official.git'
          plugins: 'code-review@claude-plugins-official'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }}'
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "리뷰 코멘트는 한국어로 쓴다. 코드 식별자, 에러 메시지, 라이브러리 이름은 원문을 유지한다. AGENTS.md의 ## Code Review Rules를 리뷰 기준으로 삼는다."
